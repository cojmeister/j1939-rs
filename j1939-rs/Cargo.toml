[package]
name = "j1939-rs"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "A Rust library for working with SAE J1939 protocol messages in embedded and automotive systems."
license = "MIT"
readme = "README.md"
homepage = "https://github.com/cojmeister/j1939-rs"
repository = "https://github.com/cojmeister/j1939-rs"
keywords = ["j1939", "can", "automotive", "embedded", "no-std"]
categories = ["aerospace::protocols", "no-std::no-alloc", "embedded", "encoding"]


[dependencies]
j1939-core = { workspace = true }
j1939-macros = { workspace = true }

[features]
default = []
# `J1939Message::from_frame` / `to_frame` and `J1939Id` <-> `embedded_can` id conversions
embedded-can = ["j1939-core/embedded-can"]
# `defmt::Format` for the public types
defmt = ["j1939-core/defmt"]

[dev-dependencies]
proptest = "1.0"
defmt = "1"