[package]
name = "j1939-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Core crate for j1939-rs"
license = "MIT"
homepage = "https://github.com/cojmeister/j1939-rs"
repository = "https://github.com/cojmeister/j1939-rs"
keywords = ["j1939", "can", "automotive", "embedded", "no-std"]
categories = ["aerospace::protocols", "no-std::no-alloc", "embedded", "encoding"]


[dependencies]
embedded-can = { version = "0.4", optional = true }
defmt = { version = "1", optional = true }

[features]
default = []
# Conversions between J1939Message / J1939Id and embedded-can frames and ids
embedded-can = ["dep:embedded-can"]
# `defmt::Format` for the public types
defmt = ["dep:defmt"]

[dev-dependencies]